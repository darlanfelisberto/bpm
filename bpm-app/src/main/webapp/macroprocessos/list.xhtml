<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:b="http://iffar.edu.br/box"
      xmlns:p="jakarta.faces.passthrough">
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="titulo">Macroprocessos</ui:define>
    <ui:define name="conteudo">

        <h2>Macroprocessos</h2>

        <b:panel>
            <h:form id="formLista">
                <h:dataTable value="#{macroprocessoBean.lista}" var="m" styleClass="grid">
                    <h:column>
                        <f:facet name="header">Nome</f:facet>
                        #{m.nome}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Objetivo</f:facet>
                        #{m.objetivo}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Ações</f:facet>
                        <h:link outcome="/processos/list" value="Processos">
                            <f:param name="macroprocessoId" value="#{m.id}"/>
                        </h:link>
                        &#160;|&#160;
                        <!-- Confirmação sem b:confirm: só o atributo data-box-confirm,
                             pego pelo listener genérico em confirmar.js. -->
                        <h:commandLink action="#{macroprocessoBean.excluir(m)}" styleClass="link-danger"
                                       p:aria-label="Excluir #{m.nome}" title="Excluir"
                                       p:data-box-confirm="Excluir o macroprocesso #{m.nome}?">
                            <i class="bi bi-trash"/>
                            <f:ajax render=":formLista"/>
                        </h:commandLink>
                    </h:column>
                </h:dataTable>
            </h:form>
        </b:panel>

        <b:panel header="Novo macroprocesso">
            <h:form id="formNovo">
                <div class="grid-12">
                    <div class="campo col-6">
                        <h:outputLabel for="nome" value="Nome"/>
                        <h:inputText id="nome" value="#{macroprocessoBean.novo.nome}" required="true"/>
                    </div>

                    <div class="campo col-12">
                        <h:outputLabel for="objetivo" value="Objetivo"/>
                        <h:inputTextarea id="objetivo" value="#{macroprocessoBean.novo.objetivo}"/>
                    </div>
                </div>
                <h:commandButton value="Salvar" action="#{macroprocessoBean.salvar}">
                    <f:ajax execute="@form" render=":formLista :formNovo"/>
                </h:commandButton>
                <h:messages errorClass="msg-error" infoClass="msg-info"/>
            </h:form>
        </b:panel>

    </ui:define>
</ui:composition>
</html>
