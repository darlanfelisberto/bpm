<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:b="http://iffar.edu.br/box"
      xmlns:p="jakarta.faces.passthrough">
<f:metadata>
    <f:viewParam name="instrumentoId" value="#{instrumentoDetalheBean.instrumentoId}" required="true"/>
</f:metadata>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="titulo">Editar questões</ui:define>
    <ui:define name="conteudo">

        <h2>#{instrumentoDetalheBean.instrumento.titulo}</h2>

        <b:panel>
            <h:form id="formGrupos">
                <h:dataTable value="#{instrumentoDetalheBean.instrumento.grupos}" var="g" styleClass="grid">
                    <h:column>
                        <f:facet name="header">Grupo</f:facet>
                        <strong>#{g.titulo}</strong> — #{g.descricao}

                        <h:dataTable value="#{g.questoes}" var="q" styleClass="grid">
                            <h:column>
                                <f:facet name="header">Questão</f:facet>
                                #{q.enunciado}
                            </h:column>
                            <h:column>
                                <f:facet name="header">Tipo</f:facet>
                                #{q.tipo}
                            </h:column>
                            <h:column>
                                <f:facet name="header">Obrigatória</f:facet>
                                #{q.obrigatoria ? 'Sim' : 'Não'}
                            </h:column>
                            <h:column>
                                <f:facet name="header">Opções</f:facet>
                                <ui:repeat value="#{q.opcoes}" var="o">
                                    #{o.texto} (#{o.valor})&#160;
                                    <b:confirmarLink action="#{instrumentoDetalheBean.excluirOpcao(o)}" styleClass="link-danger"
                                                      mensagem="Remover a opção #{o.texto}?"
                                                      p:aria-label="Remover opção #{o.texto}" title="Remover opção">
                                        <i class="bi bi-trash"/>
                                        <f:ajax render=":formGrupos"/>
                                    </b:confirmarLink>
                                    <br/>
                                </ui:repeat>
                            </h:column>
                            <h:column>
                                <f:facet name="header">Ações</f:facet>
                                <b:confirmarLink action="#{instrumentoDetalheBean.excluirQuestao(q)}" styleClass="link-danger"
                                                  mensagem="Excluir a questão #{q.enunciado}? As opções e respostas dela também serão apagadas."
                                                  p:aria-label="Excluir questão #{q.enunciado}" title="Excluir questão">
                                    <i class="bi bi-trash"/>
                                    <f:ajax render=":formGrupos"/>
                                </b:confirmarLink>
                            </h:column>
                        </h:dataTable>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Ações</f:facet>
                        <b:confirmarLink action="#{instrumentoDetalheBean.excluirGrupo(g)}" styleClass="link-danger"
                                          mensagem="Excluir o grupo #{g.titulo}? Todas as questões dele também serão apagadas."
                                          p:aria-label="Excluir grupo #{g.titulo}" title="Excluir grupo">
                            <i class="bi bi-trash"/>
                            <f:ajax render=":formGrupos"/>
                        </b:confirmarLink>
                    </h:column>
                </h:dataTable>
            </h:form>
        </b:panel>

        <b:panel header="Novo grupo de questões">
            <h:form id="formNovoGrupo">
                <div class="grid-12">
                    <div class="campo col-6">
                        <h:outputLabel for="titulo" value="Título"/>
                        <h:inputText id="titulo" value="#{instrumentoDetalheBean.novoGrupo.titulo}" required="true"/>
                    </div>

                    <div class="campo col-12">
                        <h:outputLabel for="descricao" value="Descrição"/>
                        <h:inputTextarea id="descricao" value="#{instrumentoDetalheBean.novoGrupo.descricao}"/>
                    </div>
                </div>
                <h:commandButton value="Adicionar grupo" action="#{instrumentoDetalheBean.salvarGrupo}">
                    <f:ajax execute="@form" render=":formGrupos :formNovoGrupo :formNovaQuestao"/>
                </h:commandButton>
            </h:form>
        </b:panel>

        <b:panel header="Nova questão">
            <h:form id="formNovaQuestao">
                <div class="grid-12">
                    <div class="campo col-6">
                        <h:outputLabel for="grupo" value="Grupo"/>
                        <h:selectOneMenu id="grupo" value="#{instrumentoDetalheBean.grupoSelecionadoId}" required="true">
                            <f:selectItems value="#{instrumentoDetalheBean.instrumento.grupos}" var="g"
                                           itemLabel="#{g.titulo}" itemValue="#{g.id}"/>
                        </h:selectOneMenu>
                    </div>

                    <div class="campo col-6">
                        <h:outputLabel for="tipo" value="Tipo"/>
                        <h:selectOneMenu id="tipo" value="#{instrumentoDetalheBean.novaQuestao.tipo}" required="true">
                            <f:selectItems value="#{instrumentoDetalheBean.tiposQuestao}"/>
                        </h:selectOneMenu>
                    </div>

                    <div class="campo col-12">
                        <h:outputLabel for="enunciado" value="Enunciado"/>
                        <h:inputTextarea id="enunciado" value="#{instrumentoDetalheBean.novaQuestao.enunciado}" required="true"/>
                    </div>

                    <div class="campo col-6">
                        <h:outputLabel for="obrigatoria" value="Obrigatória"/>
                        <h:selectBooleanCheckbox id="obrigatoria" value="#{instrumentoDetalheBean.novaQuestao.obrigatoria}"/>
                    </div>
                </div>
                <h:commandButton value="Adicionar questão" action="#{instrumentoDetalheBean.salvarQuestao}">
                    <f:ajax execute="@form" render=":formGrupos :formNovaQuestao :formNovaOpcao"/>
                </h:commandButton>
                <h:messages errorClass="msg-error" infoClass="msg-info"/>
            </h:form>
        </b:panel>

        <b:panel header="Nova opção (para questões de escala/múltipla escolha)">
            <h:form id="formNovaOpcao">
                <div class="grid-12">
                    <div class="campo col-12">
                        <h:outputLabel for="questao" value="Questão"/>
                        <h:selectOneMenu id="questao" value="#{instrumentoDetalheBean.questaoSelecionadaId}" required="true">
                            <ui:repeat value="#{instrumentoDetalheBean.instrumento.grupos}" var="g">
                                <f:selectItems value="#{g.questoes}" var="q" itemLabel="#{q.enunciado}" itemValue="#{q.id}"/>
                            </ui:repeat>
                        </h:selectOneMenu>
                    </div>

                    <div class="campo col-8">
                        <h:outputLabel for="texto" value="Texto da opção"/>
                        <h:inputText id="texto" value="#{instrumentoDetalheBean.novaOpcao.texto}" required="true"/>
                    </div>

                    <div class="campo col-4">
                        <h:outputLabel for="valor" value="Valor (para cálculo de médias)"/>
                        <h:inputText id="valor" value="#{instrumentoDetalheBean.novaOpcao.valor}"/>
                    </div>
                </div>
                <h:commandButton value="Adicionar opção" action="#{instrumentoDetalheBean.salvarOpcao}">
                    <f:ajax execute="@form" render=":formGrupos :formNovaOpcao"/>
                </h:commandButton>
            </h:form>
        </b:panel>

    </ui:define>
</ui:composition>
</html>
