<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="jakarta.faces.passthrough"
                xmlns:b="http://iffar.edu.br/box">
    <ui:define name="titulo">Instrumentos avaliativos</ui:define>
    <ui:define name="conteudo">

        <h2>Instrumentos avaliativos</h2>

        <h:form id="frmPrincipal">
            <b:panel header="Busca Instrumento">
                <div class="grid-12">
                    <div class="campo col-6">
                        <h:outputLabel for="nome" value="Nome"/>
                        <h:inputText id="nome" value="#{instrumentoAvaliacaoBean.nome}" />
                    </div>
                </div>
                <h:commandButton value="Buscar" actionListener="#{instrumentoAvaliacaoBean.buscar}">
                    <f:ajax render=":frmPrincipal"/>
                </h:commandButton>
            </b:panel>
        </h:form>
    </ui:define>
</ui:composition>
