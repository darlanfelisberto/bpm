<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:b="http://iffar.edu.br/box">
<h:head>
    <title><ui:insert name="titulo">BPM IFFar</ui:insert></title>
    <!-- Bootstrap Icons auto-hospedada (webapp/vendor/bootstrap-icons/), servida
         como arquivo estatico comum (fora do resource handler do JSF) para as
         referencias relativas a fonts/ dentro do CSS funcionarem sem ajuste. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <h:outputStylesheet library="css" name="app.css"/>
    <h:outputScript library="box" name="core/box-core.js"/>
    <!-- confirm.js/css (lib box): <box-confirm> é um custom element puro,
         não um componente Faces, então ninguém pede o recurso pra JSF
         incluir automaticamente - por isso inclui aqui manualmente, uma
         vez, pra toda a aplicacao. confirm.js funciona standalone, sem
         depender de box-core.js (só usa ele de forma oportunista pra
         tradução, quando outro componente do box já carregou). -->
    <h:outputScript library="box" name="confirm/confirm.js"/>
    <h:outputScript library="js" name="navegacao.js" target="body"/>
    <ui:insert name="head-extra"/>
</h:head>
<h:body>
    <b:growl id="growl"/>
    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="app-brand">
                <span class="app-brand-mark" aria-hidden="true"><i class="bi bi-diagram-3-fill"/></span>
                <div>
                    <span class="app-brand-name">BPM IFFar</span>
                    <span class="app-brand-caption">Gestão de processos</span>
                </div>
            </div>

            <nav class="app-nav" aria-label="Menu principal">
                <span class="app-nav-title">NAVEGAÇÃO</span>
                <a href="#{request.contextPath}/index.xhtml" class="app-nav-link" data-section="inicio">
                    <i class="bi bi-house-door" aria-hidden="true"/><span>Início</span>
                </a>
                <a href="#{request.contextPath}/macroprocessos/list.xhtml" class="app-nav-link" data-section="macroprocessos">
                    <i class="bi bi-diagram-2" aria-hidden="true"/><span>Macroprocessos</span>
                </a>
                <a href="#{request.contextPath}/avaliacao/instrumentos/list.xhtml" class="app-nav-link" data-section="avaliacoes">
                    <i class="bi bi-clipboard-check" aria-hidden="true"/><span>Avaliações</span>
                </a>
                <a href="#{request.contextPath}/avaliacao/instrumentos/instrumento.xhtml" class="app-nav-link" data-section="instrumentos">
                    <i class="bi bi-ui-checks-grid" aria-hidden="true"/><span>Instrumentos</span>
                </a>
            </nav>

            <div class="app-sidebar-footer">Instituto Federal Farroupilha</div>
        </aside>

        <main class="app-content" id="conteudo">
            <div class="app-content-inner">
                <div class="app-page-context">IFFar <span aria-hidden="true">/</span> BPM</div>
                <ui:insert name="conteudo"/>
            </div>
        </main>
    </div>
</h:body>
</html>
