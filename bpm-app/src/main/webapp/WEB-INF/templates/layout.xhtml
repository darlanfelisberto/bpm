<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title><ui:insert name="titulo">BPM IFFar</ui:insert></title>
    <!-- Bootstrap Icons auto-hospedada (webapp/vendor/bootstrap-icons/), servida
         como arquivo estatico comum (fora do resource handler do JSF) para as
         referencias relativas a fonts/ dentro do CSS funcionarem sem ajuste. -->
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.css"/>
    <h:outputStylesheet library="css" name="app.css"/>
    <!-- confirm.js/css (lib box): quando usado via b:confirm, o proprio
         componente puxa esses recursos sozinho (@ResourceDependency). Quando
         usado via atributo puro data-box-confirm (sem nenhum componente
         Faces), ninguem mais pede o recurso pra JSF incluir - por isso
         inclui aqui manualmente, uma vez, pra toda a aplicacao. -->
    <h:outputStylesheet library="box" name="confirm/confirm.css"/>
    <h:outputScript library="box" name="confirm/confirm.js"/>
    <ui:insert name="head-extra"/>
</h:head>
<h:body>
    <header class="app-header">
        <h1><h:link outcome="/index" value="BPM IFFar" style="color: inherit; text-decoration: none;"/></h1>
        <nav>
            <h:link outcome="/index" value="Início"/>
            <h:link outcome="/macroprocessos/list" value="Macroprocessos"/>
            <h:link outcome="/avaliacao/instrumentos/list" value="Avaliações"/>
        </nav>
    </header>
    <main class="app-content">
        <ui:insert name="conteudo"/>
    </main>
</h:body>
</html>
