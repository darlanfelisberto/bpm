<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <title><ui:insert name="title">box-showcase</ui:insert></title>
    <h:outputStylesheet library="css" name="app.css"/>
    <!-- confirm.js/css (box lib): when used via b:confirm, the component
         itself pulls in these resources (@ResourceDependency). When used
         via the plain data-box-confirm attribute (no Faces component at
         all), nothing else asks JSF to include the resource - so it's
         included here manually, once, for the whole application (same
         pattern as bpm-app). -->
    <h:outputStylesheet library="box" name="confirm/confirm.css"/>
    <h:outputScript library="box" name="confirm/confirm.js"/>
    <ui:insert name="head-extra"/>
</h:head>
<h:body>
    <header class="app-header">
        <h1><h:link outcome="/index" value="box-showcase" style="color: inherit; text-decoration: none;"/></h1>
        <nav>
            <h:link outcome="/index" value="Home"/>
            <h:link outcome="/panel" value="b:panel"/>
            <h:link outcome="/confirm" value="b:confirm"/>
            <h:link outcome="/editor" value="b:editor"/>
            <h:link outcome="/growl" value="b:growl"/>
            <h:link outcome="/schedule" value="b:schedule"/>
            <h:link outcome="/schedule2" value="b:schedule2"/>
            <h:link outcome="/popup" value="b:popup"/>
            <h:link outcome="/datatable" value="b:datatable"/>
        </nav>
    </header>
    <main class="app-content">
        <ui:insert name="content"/>
    </main>
</h:body>
</html>
