<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="titulo">Macroprocessos</ui:define>
    <ui:define name="conteudo">

        <h2>Macroprocessos</h2>

        <div class="card">
            <h:form id="formLista">
                <h:dataTable value="#{macroprocessoBean.lista}" var="m" styleClass="grid">
                    <h:column>
                        <f:facet name="header">Nome</f:facet>
                        #{m.nome}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Objetivo</f:facet>
                        #{m.objetivo}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Ações</f:facet>
                        <h:link outcome="/processos/list" value="Processos">
                            <f:param name="macroprocessoId" value="#{m.id}"/>
                        </h:link>
                        &#160;|&#160;
                        <h:commandLink value="Excluir" action="#{macroprocessoBean.excluir(m)}" styleClass="link-danger">
                            <f:ajax render=":formLista"/>
                        </h:commandLink>
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>

        <div class="card">
            <h:form id="formNovo">
                <h3>Novo macroprocesso</h3>
                <h:panelGrid columns="2" styleClass="form-grid">
                    <h:outputLabel for="nome" value="Nome"/>
                    <h:inputText id="nome" value="#{macroprocessoBean.novo.nome}" required="true"/>

                    <h:outputLabel for="objetivo" value="Objetivo"/>
                    <h:inputTextarea id="objetivo" value="#{macroprocessoBean.novo.objetivo}"/>
                </h:panelGrid>
                <h:commandButton value="Salvar" action="#{macroprocessoBean.salvar}">
                    <f:ajax execute="@form" render=":formLista :formNovo"/>
                </h:commandButton>
                <h:messages errorClass="msg-error" infoClass="msg-info"/>
            </h:form>
        </div>

    </ui:define>
</ui:composition>
</html>
