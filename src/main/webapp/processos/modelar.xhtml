<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="processoId" value="#{processoDetalheBean.processoId}" required="true"/>
</f:metadata>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="titulo">Modelagem do processo</ui:define>
    <ui:define name="conteudo">

        <h2>#{processoDetalheBean.processo.nome}</h2>
        <p>
            <button type="button" id="btn-salvar-diagrama">Salvar diagrama</button>
            <span id="status-salvar"></span>
        </p>

        <div id="bpmn-canvas" style="height: 600px; border: 1px solid #cbd2d9;"></div>

        <!--
          bpmn-js Modeler (edicao completa: paleta, context pad, conexoes)
          via CDN publico (unpkg). Verificar periodicamente se ha versao
          mais recente em https://unpkg.com/browse/bpmn-js/dist/
        -->
        <script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-modeler.production.min.js"></script>
        <script>
            (function () {
                var processoId = #{processoDetalheBean.processoId};
                var urlDiagrama = '/api/processos/' + processoId + '/diagrama';
                var modeler = new BpmnJS({ container: '#bpmn-canvas' });
                var status = document.getElementById('status-salvar');

                function carregar() {
                    fetch(urlDiagrama)
                        .then(function (resp) { return resp.text(); })
                        .then(function (xml) { return modeler.importXML(xml); })
                        .then(function () { modeler.get('canvas').zoom('fit-viewport'); })
                        .catch(function (err) {
                            console.error('Erro ao carregar o diagrama', err);
                            status.textContent = 'Erro ao carregar o diagrama.';
                        });
                }

                document.addEventListener('DOMContentLoaded', function () {
                    carregar();
                    document.getElementById('btn-salvar-diagrama').addEventListener('click', function () {
                        status.textContent = 'Salvando...';
                        modeler.saveXML({ format: true }).then(function (resultado) {
                            return fetch(urlDiagrama, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/xml' },
                                body: resultado.xml
                            });
                        }).then(function (resp) {
                            status.textContent = resp.ok ? 'Salvo.' : 'Erro ao salvar.';
                        }).catch(function (err) {
                            console.error('Erro ao salvar o diagrama', err);
                            status.textContent = 'Erro ao salvar.';
                        });
                    });
                });
            })();
        </script>

    </ui:define>
</ui:composition>
</html>
