<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="processoId" value="#{processoDetalheBean.processoId}" required="true"/>
</f:metadata>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="titulo">Modelagem do processo</ui:define>
    <ui:define name="head-extra">
        <!-- CSS do bpmn-js: sem isso a paleta/context pad ficam sem estilo
             e sem os icones (fonte bpmn-embedded), parecendo inexistentes. -->
        <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/diagram-js.css"/>
        <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-font/css/bpmn-embedded.css"/>
        <!-- CSS do painel de propriedades: mora no pacote @bpmn-io/properties-panel
             (dependencia da qual bpmn-js-properties-panel depende), nao no
             proprio bpmn-js-properties-panel. -->
        <link rel="stylesheet" href="https://unpkg.com/@bpmn-io/properties-panel@3.48.0/dist/assets/properties-panel.css"/>
    </ui:define>
    <ui:define name="conteudo">

        <h2>#{processoDetalheBean.processo.nome}</h2>
        <p>
            <button type="button" id="btn-salvar-diagrama">Salvar diagrama</button>
            <span id="status-salvar"></span>
        </p>

        <div style="display: flex; gap: 0.5rem;">
            <div id="bpmn-canvas" style="flex: 1; height: 600px; border: 1px solid #cbd2d9;"></div>
            <div id="bpmn-properties" style="width: 300px; height: 600px; border: 1px solid #cbd2d9; overflow: auto;"></div>
        </div>

        <!--
          bpmn-js Modeler (edicao completa: paleta, context pad, conexoes) +
          painel de propriedades, ambos via CDN publico (unpkg). Verificar
          periodicamente se ha versao mais recente em
          https://unpkg.com/browse/bpmn-js/dist/ e
          https://unpkg.com/browse/bpmn-js-properties-panel/dist/
        -->
        <script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-modeler.production.min.js"></script>
        <script src="https://unpkg.com/bpmn-js-properties-panel@5.63.0/dist/bpmn-js-properties-panel.umd.js"></script>
        <script>
            (function () {
                var processoId = #{processoDetalheBean.processoId};
                var urlDiagrama = '/api/processos/' + processoId + '/diagrama';
                var status = document.getElementById('status-salvar');

                var painelPropriedades = window.BpmnJSPropertiesPanel;
                var modeler = new BpmnJS({
                    container: '#bpmn-canvas',
                    additionalModules: [
                        painelPropriedades.BpmnPropertiesPanelModule,
                        painelPropriedades.BpmnPropertiesProviderModule
                    ]
                });

                function carregar() {
                    fetch(urlDiagrama)
                        .then(function (resp) { return resp.text(); })
                        .then(function (xml) { return modeler.importXML(xml); })
                        .then(function () {
                            modeler.get('canvas').zoom('fit-viewport');
                            modeler.get('propertiesPanel').attachTo('#bpmn-properties');
                        })
                        .catch(function (err) {
                            console.error('Erro ao carregar o diagrama', err);
                            status.textContent = 'Erro ao carregar o diagrama.';
                        });
                }

                document.addEventListener('DOMContentLoaded', function () {
                    carregar();
                    document.getElementById('btn-salvar-diagrama').addEventListener('click', function () {
                        status.textContent = 'Salvando...';
                        modeler.saveXML({ format: true }).then(function (resultado) {
                            return fetch(urlDiagrama, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/xml' },
                                body: resultado.xml
                            });
                        }).then(function (resp) {
                            status.textContent = resp.ok ? 'Salvo.' : 'Erro ao salvar.';
                        }).catch(function (err) {
                            console.error('Erro ao salvar o diagrama', err);
                            status.textContent = 'Erro ao salvar.';
                        });
                    });
                });
            })();
        </script>

    </ui:define>
</ui:composition>
</html>
