<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="processoId" value="#{processoDetalheBean.processoId}" required="true"/>
</f:metadata>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="titulo">Diagrama do processo</ui:define>
    <ui:define name="conteudo">

        <h2>Diagrama: #{processoDetalheBean.processo.nome}</h2>
        <p>
            <h:link outcome="/processos/modelar" value="Voltar para modelagem">
                <f:param name="processoId" value="#{processoDetalheBean.processoId}"/>
            </h:link>
        </p>

        <!-- XML gerado pelo BpmnXmlBuilder a partir das etapas/fluxos cadastrados.
             Fica num textarea oculto (texto HTML-escapado pelo Facelets) para o
             JavaScript ler via .value sem risco de injeção. -->
        <textarea id="bpmn-xml" style="display:none;">#{processoDetalheBean.xmlBpmn}</textarea>

        <div id="bpmn-canvas" style="height: 600px; border: 1px solid #cbd2d9;"></div>

        <!--
          bpmn-js via CDN publico (unpkg). Verificar periodicamente se ha
          versao mais recente em https://unpkg.com/browse/bpmn-js/dist/
        -->
        <script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-viewer.production.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var xml = document.getElementById('bpmn-xml').value;
                var viewer = new BpmnJS({ container: '#bpmn-canvas' });
                viewer.importXML(xml).then(function () {
                    viewer.get('canvas').zoom('fit-viewport');
                }).catch(function (err) {
                    console.error('Erro ao renderizar o diagrama BPMN', err);
                });
            });
        </script>

    </ui:define>
</ui:composition>
</html>
