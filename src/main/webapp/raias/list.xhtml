<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="processoId" value="#{raiaBean.processoId}" required="true"/>
</f:metadata>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="titulo">Raias do processo</ui:define>
    <ui:define name="conteudo">

        <h2>Raias de #{raiaBean.processo.nome}</h2>
        <p>
            <h:link outcome="/processos/modelar" value="Voltar para modelagem">
                <f:param name="processoId" value="#{raiaBean.processoId}"/>
            </h:link>
        </p>

        <h:form id="formLista">
            <h:dataTable value="#{raiaBean.lista}" var="r" styleClass="grid">
                <h:column>
                    <f:facet name="header">Ordem</f:facet>
                    #{r.ordem}
                </h:column>
                <h:column>
                    <f:facet name="header">Nome</f:facet>
                    #{r.nome}
                </h:column>
                <h:column>
                    <f:facet name="header">Ações</f:facet>
                    <h:commandLink value="Editar" action="#{raiaBean.editar(r)}">
                        <f:ajax render=":formNovo"/>
                    </h:commandLink>
                    &#160;|&#160;
                    <h:commandLink value="Excluir" action="#{raiaBean.excluir(r)}">
                        <f:ajax render=":formLista :formNovo"/>
                    </h:commandLink>
                </h:column>
            </h:dataTable>
        </h:form>

        <h:form id="formNovo">
            <h3>#{raiaBean.novo.id == null ? 'Nova raia' : 'Editar raia'}</h3>
            <h:panelGrid columns="2">
                <h:outputLabel for="nome" value="Nome"/>
                <h:inputText id="nome" value="#{raiaBean.novo.nome}" required="true"/>

                <h:outputLabel for="ordem" value="Ordem"/>
                <h:inputText id="ordem" value="#{raiaBean.novo.ordem}"/>
            </h:panelGrid>
            <h:commandButton value="Salvar" action="#{raiaBean.salvar}">
                <f:ajax execute="@form" render=":formLista :formNovo"/>
            </h:commandButton>
            <h:commandButton value="Cancelar" action="#{raiaBean.cancelarEdicao}" immediate="true">
                <f:ajax render=":formNovo"/>
            </h:commandButton>
            <h:messages/>
        </h:form>

    </ui:define>
</ui:composition>
</html>
